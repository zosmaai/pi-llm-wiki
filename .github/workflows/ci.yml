name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run Tests with Coverage
        run: pnpm test:coverage

      - name: Upload Coverage to Codecov
        if: ${{ matrix.node-version == 22 && github.event_name == 'push' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  qmd-native-compatibility:
    name: QMD native compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Verify QMD SDK and model-free lexical search
        run: pnpm exec vitest run test/qmd-contract.test.ts --reporter=verbose
        env:
          QMD_FORCE_CPU: "1"

  migration-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Pack and execute migration on Node 18
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/legacy vault"
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$fixture/.wiki" "$fixture/wiki/concepts" "$unpacked"
          printf '{"name":"Node 18 fixture"}\n' > "$fixture/.wiki/config.json"
          printf '%s\n' '---' 'type: concept' '---' '' 'Node 18 body.' > "$fixture/wiki/concepts/node-18.md"
          config_hash=$(sha256sum "$fixture/.wiki/config.json" | cut -d' ' -f1)
          page_hash=$(sha256sum "$fixture/wiki/concepts/node-18.md" | cut -d' ' -f1)

          tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$unpacked"
          node "$unpacked/package/scripts/migrate-llm-wiki.js" "$fixture" --force

          test -f "$fixture/.llm-wiki/config.json"
          test -f "$fixture/.llm-wiki/wiki/concepts/node-18.md"
          test "$(sha256sum "$fixture/.llm-wiki/config.json" | cut -d' ' -f1)" = "$config_hash"
          test "$(sha256sum "$fixture/.llm-wiki/wiki/concepts/node-18.md" | cut -d' ' -f1)" = "$page_hash"

  packaged-mcp-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      # test/mcp-package.test.ts covers the same handshake, but always against
      # this repo's lockfile. Consumers install without it and resolve the
      # newest versions our ranges allow (issue #128), so pack the tarball and
      # run the server from a lockfile-free install of it.
      - name: Smoke-test the packed MCP server from a lockfile-free install
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"

          # prepack builds dist/, so no --ignore-scripts here.
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)

          cd "$consumer"
          npm init -y > /dev/null
          npm install --no-package-lock --no-audit --no-fund "$RUNNER_TEMP/$tarball"

          installed="$consumer/node_modules/@zosmaai/pi-llm-wiki"
          test -f "$installed/dist/mcp/index.js"
          node -e "console.log('resolved MCP SDK:', require('$consumer/node_modules/@modelcontextprotocol/server/package.json').version)"

          node "$GITHUB_WORKSPACE/scripts/mcp-smoke.mjs" "$installed/dist/mcp/index.js"
